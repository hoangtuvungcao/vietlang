<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#065F46" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Body -->
  <path d="M 24 16 Q 64 6 104 16 Q 108 50 100 84 Q 86 112 64 122 Q 42 112 28 84 Q 20 50 24 16 Z" 
        fill="url(#shieldGrad)" stroke="#10B981" stroke-width="2.5" />

  <!-- Inner Rim -->
  <path d="M 30 22 Q 64 14 98 22 Q 102 50 94 80 Q 82 104 64 114 Q 46 104 34 80 Q 26 50 30 22 Z" 
        fill="none" stroke="#F59E0B" stroke-width="1.2" opacity="0.6" />

  <!-- .VL Tag -->
  <text x="64" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="18" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="1">.VL</text>

  <!-- Stylized V lettermark -->
  <path d="M 38 48 L 52 86 L 64 86 L 48 48 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <path d="M 76 48 L 64 86 L 56 86 L 68 48 Z" fill="url(#emeraldGrad)" filter="url(#glow)" />

  <!-- Stylized L Gold Ribbon -->
  <path d="M 66 52 L 80 52 L 68 84 L 92 84 L 88 92 L 58 92 Z" fill="url(#goldGrad)" filter="url(#glow)" />
</svg>
