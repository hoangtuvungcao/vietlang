name: Build & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Engine & Framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Core Cargo Tests
        run: cargo test --all
      - name: Run VietLang Integration Tests
        run: |
          cargo build --release
          ./target/release/vietlang test examples/enterprise_ecosystem_demo.vl
          ./target/release/vietlang test examples/agricultural_ecommerce_platform/tests/full_system_test.vl
          ./target/release/vietlang test examples/multi_database_demo.vl

  build-vsix:
    name: Package VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package VSIX
        run: |
          cd editors/vscode
          npx -y @vscode/vsce package --no-git-tag-version
      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vietlang-vscode-extension
          path: editors/vscode/*.vsix

  build-binaries:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: vietlang
            artifact: vietlang-linux-x64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: vietlang
            artifact: vietlang-linux-arm64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            binary: vietlang.exe
            artifact: vietlang-windows-x64.exe
          - target: x86_64-apple-darwin
            os: macos-latest
            binary: vietlang
            artifact: vietlang-macos-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            binary: vietlang
            artifact: vietlang-macos-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross - Linux/Windows)
        if: matrix.os == 'ubuntu-latest'
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native - macOS)
        if: matrix.os == 'macos-latest'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Copy Binary
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.artifact }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish GitHub Release
    needs: [build-binaries, build-vsix]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
