[package]
name = "vietlang"
version = "0.3.0-alpha.1"
edition = "2021"
description = "VietLang - An experimental backend-first programming language"
authors = ["VanTrong"]
license = "MIT"
repository = "https://github.com/hoangtuvungcao/vietlang"
keywords = ["programming-language", "backend", "interpreter", "vietnamese"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
axum = { version = "=0.8.8", features = ["http1", "http2", "tokio", "ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
hmac = "0.12"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ed25519-dalek = "2"
fs2 = "0.4"
futures-util = "0.3"
# SQL databases
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "mysql"] }
# Async NoSQL, cache, search, and analytics adapters
mongodb = "3"
redis = { version = "0.29", features = ["tokio-comp", "connection-manager", "aio"] }
scylla = "0.14"
elasticsearch = { version = "8.15.0-alpha.1", default-features = false, features = ["rustls-tls"] }
# HTTP / Transport
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2", "charset", "gzip", "brotli", "deflate", "json"] }
rustls = "0.23"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[dev-dependencies]
rcgen = "0.14"

[[bin]]
name = "vietlang"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
